services:
  backend:
    build:
      context: ./shadowsCage1
      dockerfile: Dockerfile
    container_name: shadowscage-backend
    restart: unless-stopped
    env_file:
      - ./shadowsCage1/.env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
    ports:
      - "8000:8000"
    volumes:
      - ./shadowsCage1:/app

  frontend:
    build:
      context: ./ShadowsCageFrontEnd/shadowsCage-frontend
      dockerfile: Dockerfile
    container_name: shadowscage-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "/api/"
    ports:
      - "5173:5173"
    volumes:
      - ./ShadowsCageFrontEnd/shadowsCage-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
